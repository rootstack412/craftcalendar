<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<script>
// Replace the old EVENTS = [...] block with this:
let EVENTS = [];

async function loadEvents() {
    try {
        const response = await fetch('events.xlsx');
        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, {type: 'array'});
        
        // Assuming the data is in the first sheet
        const firstSheet = workbook.SheetNames[0];
        const data = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);
        
        // Transform the data if necessary (e.g., handling boolean strings)
        EVENTS = data.map(e => ({
            ...e,
            indoor: !!e.indoor,
            outdoor: !!e.outdoor,
            confirmed: !!e.confirmed,
            price: parseFloat(e.price) || 0
        }));
        
        // Re-initialize your table after data is loaded
        renderTable(); 
        applyFilters();
    } catch (err) {
        console.error("Error loading Excel file:", err);
    }
}

// Ensure you call this when the page loads
loadEvents();

}
</script>
