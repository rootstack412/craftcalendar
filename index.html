<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Events - Craft Calendar</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --paper:#f5efe0;--paper-dark:#ede3cc;--paper-rule:#d8ccb0;--ink:#2c2410;--ink-muted:#6b5b3e;--accent:#8b4513;--green:#3a7a3a;--red:#9b3a2a; }
        *{box-sizing:border-box;}
        body{background:#e0d8c3;font-family:'Source Sans 3',sans-serif;color:var(--ink);margin:0;padding:20px;}
        .craft-page{max-width:1300px;margin:0 auto;background:var(--paper);padding:2.5rem;border-radius:3px;box-shadow:4px 4px 0 #a89070;}
        .craft-header{border-bottom:2px solid var(--accent);margin-bottom:1.5rem;padding-bottom:1rem;}
        h1{font-family:'Playfair Display',serif;color:var(--accent);margin:0 0 1rem 0;font-size:2rem;}
        .filter-bar{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:.6rem;margin-bottom:.6rem;}
        .filter-bar-row2{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:.6rem;margin-bottom:.75rem;align-items:end;}
        .filter-group{display:flex;flex-direction:column;gap:3px;}
        .filter-group label{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);font-weight:600;}
        input[type="text"],input[type="number"],select{font-family:'Source Sans 3',sans-serif;font-size:.875rem;color:var(--ink);background:var(--paper);border:1px solid var(--paper-rule);border-radius:3px;padding:.45rem .65rem;outline:none;width:100%;transition:border-color .15s;}
        input:focus,select:focus{border-color:var(--accent);}
        select{background:var(--paper-dark);cursor:pointer;}
        .dist-row{display:flex;gap:.4rem;align-items:center;}
        .dist-row input[type="text"]{flex:1;}
        .dist-row input[type="number"]{width:80px;flex:none;}
        .dist-row span{font-size:.8rem;color:var(--ink-muted);white-space:nowrap;}
        .btn-clear{font-family:'Source Sans 3',sans-serif;font-size:.85rem;color:var(--ink-muted);background:none;border:1px solid var(--paper-rule);border-radius:3px;padding:.45rem .9rem;cursor:pointer;white-space:nowrap;transition:border-color .15s,color .15s;}
        .btn-clear:hover{border-color:var(--accent);color:var(--accent);}
        .dist-status{font-size:.78rem;color:var(--ink-muted);font-style:italic;margin-bottom:.4rem;min-height:1.1rem;}
        .dist-status.error{color:var(--red);font-style:normal;}
        .dist-status.ok{color:var(--green);font-style:normal;}
        .results-count{font-size:.8rem;color:var(--ink-muted);font-style:italic;margin-bottom:.5rem;}
        table{width:100%;border-collapse:collapse;margin-top:.25rem;font-size:.875rem;}
        th{background:var(--paper-dark);color:var(--ink-muted);text-align:left;padding:.65rem .6rem;text-transform:uppercase;font-size:.7rem;letter-spacing:.04em;cursor:pointer;user-select:none;white-space:nowrap;}
        th:hover{color:var(--accent);}
        th .si{margin-left:3px;opacity:.35;}
        th.sorted .si{opacity:1;color:var(--accent);}
        td{padding:.6rem .6rem;border-bottom:1px solid var(--paper-rule);vertical-align:middle;}
        tbody tr:hover{background:#f0e8d0;}
        tbody tr.hidden{display:none;}
        .badge{display:inline-block;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:3px;white-space:nowrap;}
        .badge-month{background:var(--paper-dark);color:var(--ink-muted);border:1px solid var(--paper-rule);}
        .badge-confirmed{background:#d4edda;color:#1e5c2e;border:1px solid #a8d5b5;}
        .badge-unconfirmed{background:#fff3cd;color:#7a5a00;border:1px solid #f0d080;}
        .badge-indoor{background:#ddeeff;color:#1a4a7a;border:1px solid #aaccee;}
        .badge-outdoor{background:#e8f5e0;color:#2a5a1a;border:1px solid #b0d898;}
        .badge-both{background:#ede8fa;color:#4a2a8a;border:1px solid #c0aae8;}
        .price-cell{font-weight:600;white-space:nowrap;}
        .price-free{color:var(--green);}
        .price-low{color:#4a6a2a;}
        .price-mid{color:var(--ink-muted);}
        .price-high{color:var(--red);}
        .dist-cell{white-space:nowrap;color:var(--ink-muted);font-size:.82rem;}
        .dist-near{color:var(--green);font-weight:600;}
        .dist-far{color:var(--red);}
        .event-link{color:var(--accent);text-decoration:none;}
        .event-link:hover{text-decoration:underline;}
        .location-cell{white-space:nowrap;}
        .no-results{text-align:center;padding:2.5rem;color:var(--ink-muted);font-style:italic;display:none;}
        .age-chip{font-size:.68rem;color:var(--ink-muted);border:1px solid var(--paper-rule);border-radius:10px;padding:1px 6px;margin-left:4px;white-space:nowrap;}
        @media(max-width:900px){.filter-bar{grid-template-columns:1fr 1fr;}.filter-bar-row2{grid-template-columns:1fr 1fr;}}
        @media(max-width:600px){.filter-bar,.filter-bar-row2{grid-template-columns:1fr;}.craft-page{padding:1rem;}}
    </style>
</head>

<div class="craft-page">
    <div class="craft-header">
        <h1>✦ All Events</h1>
        <div class="filter-bar">
            <div class="filter-group"><label>Search</label><input type="text" id="f-search" placeholder="Event name…" /></div>

        <div class="filter-bar-row2">

                    <span>miles</span>

            </div>
            <div class="filter-group"><label>Max Table Price ($)</label><input type="number" id="f-maxprice" min="0" placeholder="e.g. 100" /></div>
            <div class="filter-group"><label>Setting</label>

                    <option value="">All settings</option>
                    <option value="indoor">Indoor</option><option value="outdoor">Outdoor</option><option value="both">Indoor + Outdoor</option>
                </select>
            </div>
            <button class="btn-clear" id="btn-clear">✕ Clear all</button>
        </div>
        <div class="dist-status" id="dist-status"></div>
    </div>
    <div class="results-count" id="results-count"></div>
    <table>
        <thead>
            <tr>
                <th onclick="sortBy('title')" id="th-title">Event <i class="si">↕</i></th>
                <th onclick="sortBy('date')" id="th-date" class="sorted">Date <i class="si">↑</i></th>
                <th onclick="sortBy('price')" id="th-price">Table Price <i class="si">↕</i></th>
                <th>Size</th>
                <th onclick="sortBy('location')" id="th-location">Location <i class="si">↕</i></th>
                <th>Setting</th>
                <th>Status</th>
                <th onclick="sortBy('dist')" id="th-dist">Distance <i class="si">↕</i></th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>
    <div class="no-results" id="no-results">No events match your filters.</div>
</div>

function haversineMiles(a,b,c,d){const R=3958.8,dL=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}

function fmtDate(d,e){const FM=['January','February','March','April','May','June','July','August','September','October','November','December'],SM=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const[y,m,dy]=d.split('-').map(Number);if(d===e)return{badge:SM[m-1],full:`${FM[m-1]} ${dy}, ${y}`};const[,em,edy]=e.split('-').map(Number);if(m===em)return{badge:SM[m-1],full:`${FM[m-1]} ${dy}–${edy}, ${y}`};return{badge:SM[m-1],full:`${FM[m-1]} ${dy} – ${FM[em-1]} ${edy}, ${y}`};}

function priceClass(p){if(p<=1)return'price-free';if(p<=60)return'price-low';if(p<=150)return'price-mid';return'price-high';}
function settingBadge(e){if(e.indoor&&e.outdoor)return'<span class="badge badge-both">Indoor + Outdoor</span>';if(e.indoor)return'<span class="badge badge-indoor">Indoor</span>';return'<span class="badge badge-outdoor">Outdoor</span>';}

const tbody=document.getElementById('tbody');
const rows=EVENTS.map((e,i)=>{
    const tr=document.createElement('tr');
    tr.dataset.idx=i;tr.dataset.title=e.title.toLowerCase();tr.dataset.date=e.date;tr.dataset.price=e.price;
    tr.dataset.state=e.state;tr.dataset.month=e.date.slice(5,7);tr.dataset.confirmed=e.confirmed?'yes':'no';
    tr.dataset.indoor=e.indoor?'1':'0';tr.dataset.outdoor=e.outdoor?'1':'0';
    tr.dataset.lat=e.lat;tr.dataset.lng=e.lng;tr.dataset.dist='99999';
    const dt=fmtDate(e.date,e.enddate);
    const priceStr=e.price===0?'Free':e.price===1?'~Free':`$${e.price}`;
    const titleCell=e.link?`<a class="event-link" href="${e.link}" target="_blank">${e.title}</a>`:e.title;
    const ageStr=e.age>=5?`<span class="age-chip">${e.age} yr event</span>`:'';
    tr.innerHTML=`<td>${titleCell}${ageStr}</td><td><span class="badge badge-month">${dt.badge}</span> ${dt.full}</td><td class="price-cell ${priceClass(e.price)}">${priceStr}</td><td>${e.size}</td><td class="location-cell">${e.city}, ${e.state} ${e.zip}</td><td>${settingBadge(e)}</td><td>${e.confirmed?'<span class="badge badge-confirmed">✓ Confirmed</span>':'<span class="badge badge-unconfirmed">⚠ Unconfirmed</span>'}</td><td class="dist-cell" id="dist-${i}">—</td>`;
    tbody.appendChild(tr);return tr;
});

let sortCol='date',sortAsc=true;
function sortBy(col){
    if(sortCol===col)sortAsc=!sortAsc;else{sortCol=col;sortAsc=true;}
    document.querySelectorAll('th[id^="th-"]').forEach(th=>{th.classList.remove('sorted');th.querySelector('.si').textContent='↕';});
    const th=document.getElementById('th-'+col);
    if(th){th.classList.add('sorted');th.querySelector('.si').textContent=sortAsc?'↑':'↓';}
    rows.slice().sort((a,b)=>{
        let av,bv;
        if(col==='title'){av=a.dataset.title;bv=b.dataset.title;}
        else if(col==='date'){av=a.dataset.date;bv=b.dataset.date;}
        else if(col==='price'){av=+a.dataset.price;bv=+b.dataset.price;}
        else if(col==='location'){av=a.dataset.state+EVENTS[+a.dataset.idx].city;bv=b.dataset.state+EVENTS[+b.dataset.idx].city;}
        else if(col==='dist'){av=+a.dataset.dist;bv=+b.dataset.dist;}
        if(typeof av==='number')return sortAsc?av-bv:bv-av;
        return sortAsc?String(av).localeCompare(String(bv)):String(bv).localeCompare(String(av));
    }).forEach(r=>tbody.appendChild(r));
}

function applyFilters(){
    const q=document.getElementById('f-search').value.trim().toLowerCase();
    const month=document.getElementById('f-month').value;
    const state=document.getElementById('f-state').value;
    const confirmed=document.getElementById('f-confirmed').value;
    const maxPrice=document.getElementById('f-maxprice').value;
    const miles=parseFloat(document.getElementById('f-miles').value);
    const setting=document.getElementById('f-setting').value;
    const hasDist=originCoords&&!isNaN(miles)&&miles>0;
    let vis=0;
    rows.forEach(r=>{
        const e=EVENTS[+r.dataset.idx];
        const ok=(!q||r.dataset.title.includes(q))&&(!month||r.dataset.month===month)&&(!state||r.dataset.state===state)&&(!confirmed||r.dataset.confirmed===confirmed)&&(!maxPrice||e.price<=parseFloat(maxPrice))&&(!setting||(setting==='indoor'&&e.indoor)||(setting==='outdoor'&&e.outdoor)||(setting==='both'&&e.indoor&&e.outdoor))&&(!hasDist||parseFloat(r.dataset.dist)<=miles);
        r.classList.toggle('hidden',!ok);if(ok)vis++;
    });
    const any=q||month||state||confirmed||maxPrice||setting||hasDist;
    document.getElementById('results-count').textContent=any?`Showing ${vis} of ${EVENTS.length} events`:`${EVENTS.length} events`;
    document.getElementById('no-results').style.display=vis===0?'block':'none';
}

function updateDistanceCells(){
    rows.forEach(r=>{
        const e=EVENTS[+r.dataset.idx];
        const cell=document.getElementById('dist-'+r.dataset.idx);
        if(!originCoords||!e.lat){r.dataset.dist='99999';cell.textContent='—';cell.className='dist-cell';return;}
        const d=haversineMiles(originCoords.lat,originCoords.lng,e.lat,e.lng);
        r.dataset.dist=d.toFixed(1);
        cell.textContent=d<1?'< 1 mi':`${Math.round(d)} mi`;
        cell.className='dist-cell'+(d<=20?' dist-near':d>60?' dist-far':'');
    });
}

async function geocodeOrigin(query){
    if(!query.trim()){originCoords=null;updateDistanceCells();applyFilters();const s=document.getElementById('dist-status');s.textContent='';s.className='dist-status';return;}
    const s=document.getElementById('dist-status');s.textContent='Looking up location…';s.className='dist-status';
    const searchQ=(/^\d{5}$/.test(query.trim())?query.trim()+', USA':query+', USA');
    try{
        const resp=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(searchQ)}&format=json&limit=1`,{headers:{'Accept-Language':'en'}});
        const data=await resp.json();
        if(!data.length){s.textContent=`Could not find "${query}" — try "City, State" or a zip code.`;s.className='dist-status error';originCoords=null;}
        else{originCoords={lat:parseFloat(data[0].lat),lng:parseFloat(data[0].lon)};s.textContent='📍 Distances from '+data[0].display_name.split(',').slice(0,2).join(',');s.className='dist-status ok';updateDistanceCells();}
    }catch{s.textContent='Geocoding unavailable — check your connection.';s.className='dist-status error';originCoords=null;}
    applyFilters();
}

['f-search','f-month','f-state','f-confirmed','f-maxprice','f-miles','f-setting'].forEach(id=>{
    document.getElementById(id).addEventListener('input',applyFilters);
    document.getElementById(id).addEventListener('change',applyFilters);
});
document.getElementById('f-origin').addEventListener('input',function(){
    const q=this.value.trim();clearTimeout(geocodeTimer);
    if(q===lastGeoQuery)return;
    if(!q){geocodeOrigin('');lastGeoQuery='';return;}
    geocodeTimer=setTimeout(()=>{lastGeoQuery=q;geocodeOrigin(q);},700);
});
document.getElementById('btn-clear').addEventListener('click',()=>{
    ['f-search','f-origin','f-maxprice','f-miles'].forEach(id=>document.getElementById(id).value='');
    ['f-month','f-state','f-confirmed','f-setting'].forEach(id=>document.getElementById(id).value='');
    originCoords=null;lastGeoQuery='';
    const s=document.getElementById('dist-status');s.textContent='';s.className='dist-status';
    updateDistanceCells();applyFilters();
});
applyFilters();
</script>
